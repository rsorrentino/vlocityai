# Usage:
#   cp env.template .env    # then set JWT_SECRET, POSTGRES_PASSWORD and ADMIN_PASSWORD
#   docker compose up -d --build
# The app is served on http://localhost:3001. Put a TLS-terminating reverse
# proxy in front of it before exposing it beyond the local machine.

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-3001}:3001"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-vlocity}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vlocity_manager}
      REDIS_URL: redis://redis:6379
      REDIS_AUTOSTART: "false"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters)}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      - app_uploads:/app/uploads
      - app_jobs:/app/jobs
      # Salesforce CLI org authorisations (sf org login jwt / sfdx-url)
      - sf_auth:/home/node/.sf
      - sfdx_auth:/home/node/.sfdx
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vlocity_manager}
      POSTGRES_USER: ${POSTGRES_USER:-vlocity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  app_data:
  app_logs:
  app_uploads:
  app_jobs:
  sf_auth:
  sfdx_auth:
  postgres_data:
  redis_data:
