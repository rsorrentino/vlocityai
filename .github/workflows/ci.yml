name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm run test:ci

      - name: Smoke test (start server, auth gate, admin login)
        run: node scripts/smoke-test.js

  postgres:
    name: Server on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: vlocity_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PG_URL: postgres://postgres:ci-only@localhost:5432/vlocity_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install PostgreSQL client (pg_dump/psql for backup tests)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Integration tests (migrations, RBAC, chat, backup/restore)
        run: npx jest --ci --testPathPattern=__tests__/integration --runInBand
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}
          TEST_POSTGRES_URL: ${{ env.PG_URL }}

      - name: Smoke test on PostgreSQL
        run: node scripts/smoke-test.js
        env:
          SMOKE_DATABASE_URL: ${{ env.PG_URL }}

  client:
    name: Client lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --no-audit --no-fund
        working-directory: client

      - name: Lint (warnings are errors)
        run: npm run lint
        working-directory: client

      - name: Test
        run: npm test
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [server, postgres, client]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t vlocityai:ci .

      - name: Validate compose file
        run: docker compose config -q
        env:
          POSTGRES_PASSWORD: ci-only
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
